<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Reventix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Reventix</h1>
  <div id="topInfo" class="top-info"></div>
</header>

<main id="view"></main>

<button id="fab" class="fab" data-act="new" aria-label="Nueva prenda">+</button>

<nav class="tabs">
  <button data-tab="inv" class="on">Inventario</button>
  <button data-tab="stats">Estadísticas</button>
  <button data-tab="cal">Calendario</button>
  <button data-tab="set">Ajustes</button>
</nav>

<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
